<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>六级高频词汇神器 (全栈云端版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { bg: '#0f172a', card: '#1e293b', border: '#334155', text: '#f8fafc', muted: '#94a3b8' }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        /* 简单的加载动画样式 */
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #6366f1; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 dark:bg-dark-bg text-slate-800 dark:text-dark-text transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // 图标组件 (保持不变)
        const IconEye = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>;
        const IconEyeOff = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path><line x1="2" y1="2" x2="22" y2="22"></line></svg>;
        const IconLayers = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>;
        const IconCheck = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>;
        const IconBook = () => <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>;
        const IconSearch = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>;
        const IconVolume = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>;
        const IconMoon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>;
        const IconSun = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>;
        const IconReset = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>;

        // 单词卡片组件 - 采用严格的点击切换逻辑
        const WordCard = ({ item, isMastered, toggleMastered, globalReveal, speakWord }) => {
            const [isClicked, setIsClicked] = useState(false);

            const isShowContent = globalReveal || isClicked;

            return (
                <div className={`bg-white dark:bg-dark-card rounded-2xl shadow-sm border transition-all duration-300 flex flex-col justify-between overflow-hidden ${isMastered ? 'border-emerald-300 dark:border-emerald-700/50 bg-emerald-50/30 dark:bg-emerald-900/10 opacity-70' : 'border-slate-200 dark:border-dark-border hover:shadow-md hover:-translate-y-0.5 hover:border-indigo-300 dark:hover:border-indigo-500/50'}`}>
                    
                    <div className="p-4 md:p-5 flex-none">
                        <div className="flex justify-between items-start gap-4">
                            <h2 className={`text-2xl font-bold tracking-tight break-words mt-1 ${isMastered ? 'text-slate-400 dark:text-slate-500 line-through decoration-emerald-400/50' : 'text-slate-800 dark:text-slate-100'}`}>
                                {item.word}
                            </h2>

                            <div className="flex flex-col gap-2 flex-shrink-0">
                                <button onClick={(e) => speakWord(e, item.word)} className="p-1.5 rounded-full text-indigo-400 dark:text-indigo-500 hover:bg-indigo-50 dark:hover:bg-indigo-900/30 transition-colors">
                                    <IconVolume />
                                </button>
                                <button onClick={() => toggleMastered(item.originalIndex)} className={`transition duration-200 p-1.5 rounded-full hover:scale-110 ${isMastered ? 'text-emerald-500 bg-emerald-100 dark:bg-emerald-900/40' : 'text-slate-300 dark:text-slate-600 hover:text-emerald-400 hover:bg-emerald-50 dark:hover:bg-slate-700'}`}>
                                    <IconCheck className={isMastered ? 'fill-emerald-100 dark:fill-emerald-900/50' : ''} />
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* 纯点击切换释义区 */}
                    <div 
                        className="p-4 border-t border-slate-100 dark:border-dark-border relative cursor-pointer bg-slate-50/80 dark:bg-slate-800/80 flex-grow flex flex-col justify-center"
                        onClick={() => setIsClicked(!isClicked)}
                    >
                        <div className={`absolute inset-0 bg-slate-200/95 dark:bg-slate-700/95 backdrop-blur-sm flex items-center justify-center transition-opacity duration-300 z-10 ${isShowContent ? 'opacity-0 pointer-events-none' : 'opacity-100'}`}>
                            <span className="text-xs md:text-sm text-slate-500 dark:text-slate-400 font-medium flex items-center gap-1.5">
                                <IconEye /> 点我切换显示/隐藏
                            </span>
                        </div>

                        <div className={`transition-opacity duration-300 flex flex-col gap-3 ${isShowContent ? 'opacity-100' : 'opacity-0'}`}>
                            <div className="text-slate-800 dark:text-slate-200 font-medium text-center text-sm md:text-base">
                                {item.meaning}
                            </div>
                            
                            {item.notes !== "【注】请结合语境记忆" && (
                                <div className={`text-sm p-3 rounded-xl border leading-relaxed break-words ${isMastered ? 'bg-transparent border-transparent text-slate-400 dark:text-slate-600' : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700'}`}>
                                    {item.notes.split(/(【.*?】)/g).map((part, i) => {
                                        if (part.startsWith('【')) return <span key={i} className="font-bold text-indigo-500 dark:text-indigo-400">{part}</span>;
                                        return <span key={i}>{part}</span>;
                                    })}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            // 新增状态：存储从后端拉取的云端单词、加载状态、错误信息
            const [fullWordsList, setFullWordsList] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [error, setError] = useState(null);

            const [globalReveal, setGlobalReveal] = useState(false);
            const [hideMastered, setHideMastered] = useState(false);
            const [mastered, setMastered] = useState(new Set());
            const [searchQuery, setSearchQuery] = useState("");
            const [currentPage, setCurrentPage] = useState(1);
            const [darkMode, setDarkMode] = useState(false);
            const WORDS_PER_PAGE = 30;

            // 核心魔法：页面一加载，就去后端接口拿数据！
            useEffect(() => {
                fetch('/api/words')
                    .then(response => {
                        if (!response.ok) throw new Error('网络响应异常');
                        return response.json();
                    })
                    .then(data => {
                        setFullWordsList(data); // 把拿到的千词数据库存入状态
                        setIsLoading(false);    // 关闭加载动画
                    })
                    .catch(err => {
                        console.error('获取数据失败:', err);
                        setError('无法连接到云端数据库，请确保已运行 node server.js');
                        setIsLoading(false);
                    });

                // 读取本地进度和主题设置
                const savedProgress = localStorage.getItem('cet6_mastered_words');
                if (savedProgress) setMastered(new Set(JSON.parse(savedProgress)));

                const savedTheme = localStorage.getItem('cet6_theme');
                if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    setDarkMode(true);
                }
            }, []);

            // 夜间模式控制
            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('cet6_theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('cet6_theme', 'light');
                }
            }, [darkMode]);

            const toggleMastered = (index) => {
                const newMastered = new Set(mastered);
                newMastered.has(index) ? newMastered.delete(index) : newMastered.add(index);
                setMastered(newMastered);
                localStorage.setItem('cet6_mastered_words', JSON.stringify([...newMastered]));
            };

            const resetProgress = () => {
                if(window.confirm("确定要清空所有背诵进度吗？")) {
                    setMastered(new Set());
                    localStorage.removeItem('cet6_mastered_words');
                }
            };

            const speakWord = (e, word) => {
                e.stopPropagation();
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(word);
                    utterance.lang = 'en-US';
                    utterance.rate = 0.9;
                    window.speechSynthesis.speak(utterance);
                }
            };

            const filteredWords = useMemo(() => {
                return fullWordsList.filter(item => {
                    if (hideMastered && mastered.has(item.originalIndex)) return false;
                    if (searchQuery.trim() !== "") {
                        const query = searchQuery.toLowerCase();
                        return item.word.toLowerCase().includes(query) || item.meaning.includes(query);
                    }
                    return true;
                });
            }, [hideMastered, mastered, searchQuery, fullWordsList]);

            useEffect(() => { setCurrentPage(1); }, [searchQuery, hideMastered]);

            const totalPages = Math.ceil(filteredWords.length / WORDS_PER_PAGE);
            const paginatedWords = filteredWords.slice((currentPage - 1) * WORDS_PER_PAGE, currentPage * WORDS_PER_PAGE);

            // 如果正在请求数据，展示加载画面
            if (isLoading) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center">
                        <div className="loader"></div>
                        <p className="mt-4 text-indigo-600 font-medium">正在从云端读取题库...</p>
                    </div>
                );
            }

            // 如果后端没开或者报错了，展示错误画面
            if (error) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center text-red-500">
                        <IconEyeOff />
                        <p className="mt-2 font-medium">{error}</p>
                    </div>
                );
            }

            return (
                <div className="min-h-screen p-3 md:p-6 lg:p-8">
                    <div className="max-w-7xl mx-auto">
                        <div className="bg-white dark:bg-dark-card p-5 md:p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-dark-border mb-6 md:mb-8 transition-colors duration-300">
                            
                            <div className="flex justify-between items-start mb-6">
                                <div className="flex items-center gap-3 md:gap-4 text-indigo-600 dark:text-indigo-400">
                                    <div className="hidden sm:block"><IconBook /></div>
                                    <div>
                                        <h1 className="text-xl md:text-2xl font-bold text-slate-800 dark:text-dark-text flex items-center flex-wrap gap-2">
                                            六级高频词汇 Pro
                                            <span className="text-xs font-bold bg-gradient-to-r from-emerald-500 to-teal-500 text-white px-2 py-0.5 rounded-full shadow-sm">云端连线版</span>
                                        </h1>
                                        <p className="text-xs md:text-sm text-slate-500 dark:text-dark-muted mt-1">云端数据 · 真人发音 · {fullWordsList.length} 核心词库</p>
                                    </div>
                                </div>
                                <button onClick={() => setDarkMode(!darkMode)} className="p-2.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition">
                                    {darkMode ? <IconSun /> : <IconMoon />}
                                </button>
                            </div>
                            
                            <div className="flex flex-col sm:flex-row flex-wrap items-center gap-3 w-full">
                                <div className="relative w-full sm:flex-grow sm:w-auto">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                        <IconSearch />
                                    </div>
                                    <input type="text" placeholder="搜索中英文..." className="w-full pl-10 pr-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-dark-border text-slate-800 dark:text-dark-text rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} />
                                </div>

                                <div className="flex w-full sm:w-auto gap-2">
                                    <button onClick={() => setGlobalReveal(!globalReveal)} className={`flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-3 py-2.5 rounded-xl transition font-medium text-sm whitespace-nowrap ${globalReveal ? 'bg-amber-100 dark:bg-amber-900/40 text-amber-700 dark:text-amber-400' : 'bg-indigo-50 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-300'}`}>
                                        {globalReveal ? <IconEyeOff /> : <IconEye />}
                                        {globalReveal ? "恢复遮挡" : "取消遮挡"}
                                    </button>
                                    <button onClick={() => setHideMastered(!hideMastered)} className={`flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-3 py-2.5 rounded-xl transition font-medium text-sm whitespace-nowrap ${hideMastered ? 'bg-emerald-500 text-white shadow-md' : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300'}`}>
                                        <IconLayers />
                                        {hideMastered ? "看所有" : "藏已会"}
                                    </button>
                                    <button onClick={resetProgress} className="flex-none flex items-center justify-center px-3 py-2.5 bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 rounded-xl transition font-medium text-sm">
                                        <IconReset />
                                    </button>
                                </div>
                            </div>

                            <div className="mt-5">
                                <div className="flex justify-between text-xs md:text-sm text-slate-500 dark:text-dark-muted mb-2 font-medium">
                                    <span>总进度: {mastered.size} / {fullWordsList.length}</span>
                                    <span className="text-emerald-600 dark:text-emerald-400 font-bold">{Math.round((mastered.size / (fullWordsList.length || 1)) * 100)}%</span>
                                </div>
                                <div className="w-full bg-slate-100 dark:bg-slate-800 rounded-full h-2.5 overflow-hidden">
                                    <div className="bg-gradient-to-r from-emerald-400 to-emerald-500 h-full rounded-full transition-all duration-700 ease-out" style={{ width: `${(mastered.size / (fullWordsList.length || 1)) * 100}%` }}></div>
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                            {paginatedWords.map((item) => (
                                <WordCard 
                                    key={item._id} 
                                    item={item}
                                    isMastered={mastered.has(item.originalIndex)}
                                    toggleMastered={toggleMastered}
                                    globalReveal={globalReveal}
                                    speakWord={speakWord}
                                />
                            ))}
                        </div>

                        {totalPages > 1 && (
                            <div className="mt-8 mb-4 flex items-center justify-center gap-2 md:gap-4 bg-white dark:bg-dark-card py-2.5 px-4 md:px-6 rounded-full shadow-sm border border-slate-200 dark:border-dark-border w-max mx-auto transition-colors duration-300">
                                <button onClick={() => { setCurrentPage(p => Math.max(1, p - 1)); window.scrollTo({top: 0, behavior: 'smooth'}); }} disabled={currentPage === 1} className="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 disabled:opacity-30 disabled:cursor-not-allowed transition text-slate-600 dark:text-slate-300">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                                </button>
                                <span className="text-slate-600 dark:text-slate-300 font-medium min-w-[80px] text-center text-sm md:text-base">{currentPage} / {totalPages}</span>
                                <button onClick={() => { setCurrentPage(p => Math.min(totalPages, p + 1)); window.scrollTo({top: 0, behavior: 'smooth'}); }} disabled={currentPage === totalPages} className="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 disabled:opacity-30 disabled:cursor-not-allowed transition text-slate-600 dark:text-slate-300">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
