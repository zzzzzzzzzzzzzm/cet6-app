<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>六级高频词汇 Pro (增强版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #6366f1; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const IconStar = ({filled}) => <svg className={filled ? "fill-amber-400 text-amber-400" : "text-slate-300"} xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>;
        const IconShuffle = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>;
        const IconEye = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>;
        const IconCheck = ({active}) => <svg className={active ? "text-emerald-500" : "text-slate-300"} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>;

        function App() {
            const [allWords, setAllWords] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [mastered, setMastered] = useState(new Set());
            const [starred, setStarred] = useState(new Set());
            const [user, setUser] = useState(null);
            
            const [showStarredOnly, setShowStarredOnly] = useState(false);
            const [isShuffled, setIsShuffled] = useState(false);
            const [searchQuery, setSearchQuery] = useState("");
            const [currentPage, setCurrentPage] = useState(1);
            const WORDS_PER_PAGE = 30;

            useEffect(() => {
                const token = localStorage.getItem('cet6_token');
                if (token) setUser({ token, username: localStorage.getItem('cet6_username') });
                
                fetch('/api/words').then(res => res.json()).then(data => {
                    setAllWords(data); setIsLoading(false);
                });
            }, []);

            const syncData = async (newMastered, newStarred) => {
                if (!user) return;
                fetch('/api/sync', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${user.token}` },
                    body: JSON.stringify({ 
                        masteredWords: Array.from(newMastered || mastered),
                        starredWords: Array.from(newStarred || starred)
                    })
                });
            };

            const toggleMastered = (idx) => {
                const next = new Set(mastered);
                next.has(idx) ? next.delete(idx) : next.add(idx);
                setMastered(next); syncData(next, null);
            };

            const toggleStarred = (idx) => {
                const next = new Set(starred);
                next.has(idx) ? next.delete(idx) : next.add(idx);
                setStarred(next); syncData(null, next);
            };

            const displayList = useMemo(() => {
                let list = [...allWords];
                if (showStarredOnly) list = list.filter(w => starred.has(w.originalIndex));
                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    list = list.filter(w => w.word.toLowerCase().includes(q) || w.meaning.includes(q));
                }
                if (isShuffled) {
                    for (let i = list.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [list[i], list[j]] = [list[j], list[i]];
                    }
                }
                return list;
            }, [allWords, showStarredOnly, searchQuery, isShuffled, starred]);

            const totalPages = Math.max(1, Math.ceil(displayList.length / WORDS_PER_PAGE));
            useEffect(() => { if (currentPage > totalPages) setCurrentPage(1); }, [totalPages, currentPage]);
            const currentWords = displayList.slice((currentPage - 1) * WORDS_PER_PAGE, currentPage * WORDS_PER_PAGE);

            const handlePageJump = (e) => {
                const val = e.target.value;
                if(val === "") { setCurrentPage(""); return; }
                let num = parseInt(val, 10);
                if(isNaN(num)) return;
                setCurrentPage(Math.max(1, Math.min(totalPages, num)));
                window.scrollTo({top: 0, behavior: 'smooth'});
            };

            if (isLoading) return <div className="h-screen flex items-center justify-center"><div className="loader"></div></div>;

            return (
                <div className="max-w-7xl mx-auto p-4">
                    <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-sm mb-6 sticky top-0 z-10 border border-slate-200">
                        <div className="flex flex-wrap items-center justify-between gap-4">
                            <div>
                                <h1 className="text-2xl font-bold">六级词汇 Pro</h1>
                                <p className="text-sm text-slate-500">已掌握: {mastered.size} | 生词本: {starred.size}</p>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => setIsShuffled(!isShuffled)} className={`px-4 py-2 rounded-xl flex items-center gap-2 transition ${isShuffled ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}`}>
                                    <IconShuffle /> {isShuffled ? "恢复顺序" : "随机乱序"}
                                </button>
                                <button onClick={() => setShowStarredOnly(!showStarredOnly)} className={`px-4 py-2 rounded-xl flex items-center gap-2 transition ${showStarredOnly ? 'bg-amber-500 text-white' : 'bg-slate-100 text-slate-600'}`}>
                                    <IconStar filled={showStarredOnly} /> {showStarredOnly ? "显示全部" : "只看生词"}
                                </button>
                            </div>
                        </div>
                        <input type="text" placeholder="搜索单词..." className="w-full mt-4 p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 ring-indigo-500" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} />
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                        {currentWords.map(w => (
                            <div key={w._id} className="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 relative group flex flex-col justify-between">
                                <div className="flex justify-between items-start mb-2">
                                    <h2 className={`text-xl font-bold ${mastered.has(w.originalIndex) ? 'line-through text-slate-400' : ''}`}>{w.word}</h2>
                                    <div className="flex gap-1">
                                        <button onClick={() => toggleStarred(w.originalIndex)} className="p-1 hover:scale-110 transition"><IconStar filled={starred.has(w.originalIndex)} /></button>
                                        <button onClick={() => toggleMastered(w.originalIndex)} className="p-1 hover:scale-110 transition"><IconCheck active={mastered.has(w.originalIndex)} /></button>
                                    </div>
                                </div>
                                <div className="mt-2 pt-2 border-t border-slate-50">
                                    <p className="text-slate-600 dark:text-slate-300 font-medium">{w.meaning}</p>
                                    {w.notes !== "【注】请结合语境记忆" && <p className="text-xs text-indigo-500 mt-2">{w.notes}</p>}
                                </div>
                            </div>
                        ))}
                    </div>

                    {totalPages > 1 && (
                        <div className="mt-8 flex items-center justify-center gap-4 bg-white p-4 rounded-2xl shadow-sm w-max mx-auto border border-slate-200">
                            <button onClick={() => {setCurrentPage(p => Math.max(1, p-1)); window.scrollTo(0,0);}} disabled={currentPage===1} className="p-2 disabled:opacity-30">◀</button>
                            <input type="number" value={currentPage} onChange={handlePageJump} className="w-16 text-center border rounded-lg p-1 bg-slate-50 outline-none" />
                            <span className="text-slate-500">/ {totalPages}</span>
                            <button onClick={() => {setCurrentPage(p => Math.min(totalPages, p+1)); window.scrollTo(0,0);}} disabled={currentPage===totalPages} className="p-2 disabled:opacity-30">▶</button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
