<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>六级词汇 Pro (数据永固版)</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { dark: { bg: '#0f172a', card: '#1e293b', border: '#334155', text: '#f8fafc', muted: '#94a3b8' } } } }
        }
    </script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior-x: none; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #6366f1; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        @keyframes popIn { 0% { opacity: 0; transform: translate(-50%, 5px) scale(0.95); } 100% { opacity: 1; transform: translate(-50%, 0) scale(1); } }
        .animate-pop-in { animation: popIn 0.15s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-dark-bg text-slate-800 dark:text-dark-text transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;

        const IconEye = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>;
        const IconEyeOff = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path><line x1="2" y1="2" x2="22" y2="22"></line></svg>;
        const IconLayers = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>;
        const IconCheck = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>;
        const IconBook = () => <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>;
        const IconUser = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>;
        const IconVolume = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>;
        const IconSearch = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>;
        const IconMoon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>;
        const IconSun = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>;
        const IconReset = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>;
        const IconStar = ({filled}) => <svg className={filled ? "fill-amber-400 text-amber-400" : "text-slate-300"} xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>;
        const IconShuffle = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>;
        const IconGamepad = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"></rect><line x1="6" y1="12" x2="10" y2="12"></line><line x1="8" y1="10" x2="8" y2="14"></line><line x1="15" y1="13" x2="15.01" y2="13"></line><line x1="18" y1="11" x2="18.01" y2="11"></line></svg>;
        const IconList = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>;
        const IconGrid = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>;

        const AuthModal = ({ isOpen, onClose, onLoginSuccess }) => {
            const [isLoginView, setIsLoginView] = useState(true);
            const [username, setUsername] = useState("");
            const [password, setPassword] = useState("");
            const [errorMsg, setErrorMsg] = useState("");
            const [loading, setLoading] = useState(false);
            if (!isOpen) return null;
            const handleSubmit = async (e) => {
                e.preventDefault();
                setErrorMsg(""); setLoading(true);
                try {
                    const endpoint = isLoginView ? '/api/login' : '/api/register';
                    const res = await fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.message || "请求失败");
                    if (isLoginView) { onLoginSuccess(data.token, data.username, data.masteredWords, data.starredWords, data.masteryHistory); onClose(); } 
                    else { alert("注册成功！请登录"); setIsLoginView(true); }
                } catch (err) { setErrorMsg(err.message); } finally { setLoading(false); }
            };
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
                    <div className="bg-white dark:bg-dark-card w-full max-w-md rounded-2xl shadow-xl overflow-hidden p-6">
                        <div className="flex justify-between items-center mb-6"><h2 className="text-2xl font-bold">{isLoginView ? '欢迎回来 👋' : '创建云端账号 🚀'}</h2><button onClick={onClose} className="text-slate-400">✕</button></div>
                        {errorMsg && <div className="mb-4 p-3 bg-red-50 text-red-600 rounded-lg text-sm">{errorMsg}</div>}
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <input type="text" required value={username} onChange={e => setUsername(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-900 outline-none" placeholder="用户名" />
                            <input type="password" required value={password} onChange={e => setPassword(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border bg-slate-50 dark:bg-slate-900 outline-none" placeholder="密码" />
                            <button disabled={loading} type="submit" className="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl">{loading ? '处理中...' : (isLoginView ? '登录' : '注册')}</button>
                        </form>
                        <div className="mt-6 text-center text-sm"><button onClick={() => {setIsLoginView(!isLoginView); setErrorMsg("");}} className="text-indigo-600 font-bold">{isLoginView ? "没账号？点我注册" : "去登录"}</button></div>
                    </div>
                </div>
            );
        };

        const WordCard = ({ item, isMastered, isStarred, toggleMastered, toggleStarred, globalReveal, speakWord }) => {
            const [isClicked, setIsClicked] = useState(false);
            const isShowContent = globalReveal || isClicked;
            return (
                <div className={`bg-white dark:bg-dark-card rounded-2xl shadow-sm border transition-all duration-300 flex flex-col justify-between overflow-hidden ${isMastered ? 'border-emerald-300 dark:border-emerald-700/50 bg-emerald-50/30 dark:bg-emerald-900/10 opacity-70' : 'border-slate-200 dark:border-dark-border hover:shadow-md hover:-translate-y-0.5 hover:border-indigo-300'}`}>
                    <div className="p-4 md:p-5 flex-none">
                        <div className="flex justify-between items-start gap-4">
                            <h2 className={`text-2xl font-bold tracking-tight break-words mt-1 ${isMastered ? 'text-slate-400 dark:text-slate-500 line-through decoration-emerald-400/50' : 'text-slate-800 dark:text-slate-100'}`}>{item.word}</h2>
                            <div className="flex flex-col gap-2 flex-shrink-0">
                                <button onClick={(e) => speakWord(e, item.word)} className="p-1.5 rounded-full text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-900/30 transition"><IconVolume /></button>
                                <button onClick={() => toggleStarred(item.originalIndex)} className="p-1.5 rounded-full hover:scale-110 transition"><IconStar filled={isStarred} /></button>
                                <button onClick={() => toggleMastered(item.originalIndex)} className={`transition duration-200 p-1.5 rounded-full hover:scale-110 ${isMastered ? 'text-emerald-500 bg-emerald-100 dark:bg-emerald-900/40' : 'text-slate-300 dark:text-slate-600 hover:text-emerald-400 hover:bg-emerald-50'}`}><IconCheck className={isMastered ? 'fill-emerald-100 dark:fill-emerald-900/50' : ''} /></button>
                            </div>
                        </div>
                    </div>
                    <div className="p-4 border-t border-slate-100 dark:border-dark-border relative cursor-pointer bg-slate-50/80 dark:bg-slate-800/80 flex-grow flex flex-col justify-center" onClick={() => setIsClicked(!isClicked)}>
                        <div className={`absolute inset-0 bg-slate-200/95 dark:bg-slate-700/95 backdrop-blur-sm flex items-center justify-center transition-opacity duration-300 z-10 ${isShowContent ? 'opacity-0 pointer-events-none' : 'opacity-100'}`}>
                            <span className="text-xs md:text-sm text-slate-500 font-medium flex items-center gap-1.5"><IconEye /> 点我切换显示/隐藏</span>
                        </div>
                        <div className={`transition-opacity duration-300 flex flex-col gap-3 ${isShowContent ? 'opacity-100' : 'opacity-0'}`}>
                            <div className="text-slate-800 dark:text-slate-200 font-medium text-center text-sm md:text-base">{item.meaning}</div>
                            {item.notes !== "【注】请结合语境记忆" && (<div className={`text-sm p-3 rounded-xl border leading-relaxed break-words ${isMastered ? 'bg-transparent border-transparent text-slate-400' : 'bg-white dark:bg-slate-900 text-slate-600 border-slate-200 dark:border-slate-700'}`}>{item.notes}</div>)}
                        </div>
                    </div>
                </div>
            );
        };

        const Heatmap = ({ history }) => {
            const days = 14; 
            const data = useMemo(() => {
                const map = {};
                history.forEach(entry => {
                    const d = new Date(entry.date).toLocaleDateString();
                    map[d] = (map[d] || 0) + 1;
                });
                const result = [];
                for(let i=days-1; i>=0; i--) {
                    const d = new Date(); d.setDate(d.getDate() - i);
                    const dateStr = d.toLocaleDateString();
                    result.push({ date: dateStr, count: map[dateStr] || 0 });
                }
                return result;
            }, [history]);

            return (
                <div className="flex items-end gap-1 h-12 mb-4 px-1 mt-4">
                    {data.map((d, i) => (
                        <div key={i} className="flex-1 flex flex-col items-center group relative">
                            <div className={`w-full rounded-sm transition-all duration-500 ${d.count > 0 ? 'bg-emerald-500' : 'bg-slate-200 dark:bg-slate-800'}`} 
                                 style={{ height: `${Math.min(100, (d.count/20)*100 + 10)}%`, opacity: d.count === 0 ? 0.3 : 0.5 + (d.count/50) }}>
                            </div>
                            <div className="absolute bottom-full mb-2 hidden group-hover:block bg-slate-800 text-white text-[10px] py-1 px-2 rounded whitespace-nowrap z-30">{d.date}: 掌握 {d.count} 词</div>
                        </div>
                    ))}
                </div>
            );
        };

        function App() {
            const [fullWordsList, setFullWordsList] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [mastered, setMastered] = useState(new Set());
            const [starred, setStarred] = useState(new Set());
            const [history, setHistory] = useState([]);
            const [user, setUser] = useState(null); 
            const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
            
            const [globalReveal, setGlobalReveal] = useState(false);
            const [hideMastered, setHideMastered] = useState(false);
            const [showStarredOnly, setShowStarredOnly] = useState(false);
            const [isShuffled, setIsShuffled] = useState(false);
            const [searchQuery, setSearchQuery] = useState("");
            const [currentPage, setCurrentPage] = useState(1);
            const [darkMode, setDarkMode] = useState(false);
            
            const [isListView, setIsListView] = useState(false);
            const [isQuizMode, setIsQuizMode] = useState(false);
            const [quizCurrent, setQuizCurrent] = useState(null);
            const [quizOptions, setQuizOptions] = useState([]);
            const [quizStatus, setQuizStatus] = useState("idle"); 
            const [selectedOption, setSelectedOption] = useState(null);

            const [longPressIdx, setLongPressIdx] = useState(null);
            const pressTimer = useRef(null);
            const touchStartX = useRef(0);
            const touchEndX = useRef(0);

            const WORDS_PER_PAGE = 30;

            // 🌟🌟🌟 核心 Bug 修复：页面一加载，不仅读取 token，还要向后端要最新的真实进度！
            useEffect(() => {
                const savedToken = localStorage.getItem('cet6_token');
                const savedUsername = localStorage.getItem('cet6_username');
                
                if (savedToken && savedUsername) {
                    setUser({ token: savedToken, username: savedUsername });
                    // 发起自动数据拉取请求
                    fetch('/api/user', { headers: { 'Authorization': `Bearer ${savedToken}` } })
                        .then(res => {
                            if (!res.ok) throw new Error('Token无效或已过期');
                            return res.json();
                        })
                        .then(data => {
                            // 成功拿到云端最新数据，重新覆盖本地状态！
                            setMastered(new Set(data.masteredWords || []));
                            setStarred(new Set(data.starredWords || []));
                            setHistory(data.masteryHistory || []);
                        })
                        .catch(err => {
                            console.error('自动读取进度失败，请重新登录:', err);
                            // 如果 Token 坏了，自动登出防止假登录
                            localStorage.removeItem('cet6_token');
                            localStorage.removeItem('cet6_username');
                            setUser(null);
                        });
                }
                
                fetch('/api/words').then(res => res.json()).then(data => { setFullWordsList(data); setIsLoading(false); });
                const savedTheme = localStorage.getItem('cet6_theme');
                if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) setDarkMode(true);
            }, []);

            useEffect(() => {
                if (darkMode) { document.documentElement.classList.add('dark'); localStorage.setItem('cet6_theme', 'dark'); }
                else { document.documentElement.classList.remove('dark'); localStorage.setItem('cet6_theme', 'light'); }
            }, [darkMode]);

            const handleLoginSuccess = (token, username, userMasteredWords, userStarredWords, userHistory) => {
                localStorage.setItem('cet6_token', token); localStorage.setItem('cet6_username', username);
                setUser({ token, username }); 
                setMastered(new Set(userMasteredWords || [])); setStarred(new Set(userStarredWords || [])); setHistory(userHistory || []);
            };
            const handleLogout = () => { localStorage.removeItem('cet6_token'); localStorage.removeItem('cet6_username'); setUser(null); setMastered(new Set()); setStarred(new Set()); setHistory([]); };

            const speakWord = (e, word) => {
                if(e) e.stopPropagation();
                if ('speechSynthesis' in window) { window.speechSynthesis.cancel(); const utterance = new SpeechSynthesisUtterance(word); utterance.lang = 'en-US'; window.speechSynthesis.speak(utterance); }
            };

            const syncData = async (newMastered, newStarred) => {
                if (!user) return;
                try { await fetch('/api/sync', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${user.token}` }, body: JSON.stringify({ masteredWords: Array.from(newMastered || mastered), starredWords: Array.from(newStarred || starred) }) }); } catch (err) {}
            };

            const toggleMastered = (index) => {
                const next = new Set(mastered);
                const isAdding = !next.has(index);
                isAdding ? next.add(index) : next.delete(index);
                setMastered(next);
                if (isAdding) setHistory([...history, { wordIndex: index, date: new Date() }]);
                syncData(next, null);
                if (!user) setIsAuthModalOpen(true);
            };

            const toggleStarred = (index) => {
                const next = new Set(starred); next.has(index) ? next.delete(index) : next.add(index);
                setStarred(next); syncData(null, next);
                if (!user) setIsAuthModalOpen(true);
            };

            const resetProgress = async () => {
                if(window.confirm("确定要彻底清空所有的背诵进度吗？此操作不可逆哦！")) { setMastered(new Set()); setHistory([]); syncData(new Set(), null); }
            };

            const handlePressStart = (e, idx) => { pressTimer.current = setTimeout(() => { setLongPressIdx(idx); if (window.navigator && window.navigator.vibrate) window.navigator.vibrate(50); }, 400); };
            const handlePressEnd = () => { if (pressTimer.current) clearTimeout(pressTimer.current); setLongPressIdx(null); };

            const handleTouchStart = (e) => { touchStartX.current = e.changedTouches[0].screenX; };
            const handleTouchEnd = (e, totalPgs) => {
                touchEndX.current = e.changedTouches[0].screenX;
                const distance = touchStartX.current - touchEndX.current;
                if (distance > 60) setCurrentPage(p => Math.min(totalPgs, p + 1));
                else if (distance < -60) setCurrentPage(p => Math.max(1, p - 1));
            };

            const displayList = useMemo(() => {
                let list = [...fullWordsList];
                if (hideMastered) list = list.filter(w => !mastered.has(w.originalIndex));
                if (showStarredOnly) list = list.filter(w => starred.has(w.originalIndex));
                if (searchQuery.trim() !== "") list = list.filter(w => w.word.toLowerCase().includes(searchQuery.toLowerCase()) || w.meaning.includes(searchQuery.toLowerCase()));
                if (isShuffled) { for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; } }
                return list;
            }, [fullWordsList, hideMastered, showStarredOnly, searchQuery, isShuffled, mastered, starred]);

            const totalPages = Math.max(1, Math.ceil(displayList.length / WORDS_PER_PAGE));
            useEffect(() => { if (currentPage > totalPages) setCurrentPage(1); }, [totalPages, currentPage]);
            const paginatedWords = displayList.slice((currentPage - 1) * WORDS_PER_PAGE, currentPage * WORDS_PER_PAGE);

            const generateQuiz = useCallback(() => {
                if (displayList.length < 4) return;
                const targetIdx = Math.floor(Math.random() * displayList.length);
                const target = displayList[targetIdx];
                let distractors = [];
                while(distractors.length < 3) {
                    const r = Math.floor(Math.random() * fullWordsList.length);
                    if (fullWordsList[r].originalIndex !== target.originalIndex && !distractors.find(d => d.originalIndex === fullWordsList[r].originalIndex)) distractors.push(fullWordsList[r]);
                }
                setQuizCurrent(target); setQuizOptions([target, ...distractors].sort(() => Math.random() - 0.5)); setQuizStatus("idle"); setSelectedOption(null);
            }, [displayList, fullWordsList]);
            useEffect(() => { if (isQuizMode) generateQuiz(); }, [isQuizMode, generateQuiz]);

            const handleQuizAnswer = (opt) => {
                if (quizStatus !== "idle") return;
                setSelectedOption(opt);
                if (opt.originalIndex === quizCurrent.originalIndex) {
                    setQuizStatus("correct"); setTimeout(generateQuiz, 800);
                } else {
                    setQuizStatus("wrong");
                    if (!starred.has(quizCurrent.originalIndex)) toggleStarred(quizCurrent.originalIndex);
                    setTimeout(generateQuiz, 1500);
                }
            };

            if (isLoading) return <div className="min-h-screen flex items-center justify-center"><div className="loader"></div></div>;

            return (
                <div className="min-h-screen p-3 md:p-6 lg:p-8">
                    <AuthModal isOpen={isAuthModalOpen} onClose={() => setIsAuthModalOpen(false)} onLoginSuccess={handleLoginSuccess} />
                    
                    <div className="max-w-7xl mx-auto">
                        <div className="bg-white dark:bg-dark-card p-5 md:p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-dark-border mb-6 transition-colors relative z-20">
                            <div className="flex justify-between items-start mb-2">
                                <div className="flex items-center gap-3 md:gap-4 text-indigo-600 dark:text-indigo-400">
                                    <div className="hidden sm:block"><IconBook /></div>
                                    <div>
                                        <h1 className="text-xl md:text-2xl font-bold text-slate-800 dark:text-dark-text flex items-center flex-wrap gap-2">{user ? `欢迎，${user.username} 👋` : '六级高频词汇 Pro'}</h1>
                                        <p className="text-xs md:text-sm text-slate-500 mt-1">云端总进度: {mastered.size} / {fullWordsList.length} | 生词本: {starred.size}</p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-2 md:gap-4">
                                    {user ? <button onClick={handleLogout} className="text-sm font-medium text-slate-500 hover:text-red-500">退出</button> : <button onClick={() => setIsAuthModalOpen(true)} className="flex items-center gap-1.5 px-3 py-2 bg-indigo-600 text-white text-sm font-bold rounded-xl"><IconUser /> 登录</button>}
                                    <button onClick={() => setDarkMode(!darkMode)} className="p-2.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">{darkMode ? <IconSun /> : <IconMoon />}</button>
                                </div>
                            </div>

                            <Heatmap history={history} />
                            
                            <div className="flex flex-col sm:flex-row flex-wrap items-center gap-3 w-full mb-4">
                                <div className="relative w-full sm:flex-grow">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400"><IconSearch /></div>
                                    <input type="text" placeholder="搜索中英文..." className="w-full pl-10 pr-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-dark-border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} disabled={isQuizMode} />
                                </div>
                                <div className="flex w-full sm:w-auto gap-2 flex-wrap">
                                    <button onClick={() => setIsQuizMode(!isQuizMode)} className={`flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-3 py-2.5 rounded-xl transition font-bold text-sm ${isQuizMode ? 'bg-indigo-600 text-white' : 'bg-gradient-to-r from-indigo-500 to-purple-600 text-white shadow-md'}`}><IconGamepad /> {isQuizMode ? "退出测验" : "随堂测验"}</button>
                                    <button onClick={() => setIsListView(!isListView)} className={`flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-3 py-2.5 rounded-xl transition font-medium text-sm disabled:opacity-50 ${isListView ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300'}`} disabled={isQuizMode}>{isListView ? <IconGrid /> : <IconList />} {isListView ? "卡片" : "速览"}</button>
                                    <button onClick={() => setGlobalReveal(!globalReveal)} className={`flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-3 py-2.5 rounded-xl transition font-medium text-sm disabled:opacity-50 ${globalReveal ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300'}`} disabled={isQuizMode || isListView}>{globalReveal ? <IconEyeOff /> : <IconEye />} 取消遮挡</button>
                                    <button onClick={() => setIsShuffled(!isShuffled)} className={`flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-3 py-2.5 rounded-xl transition font-medium text-sm disabled:opacity-50 ${isShuffled ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300'}`} disabled={isQuizMode}><IconShuffle /> {isShuffled ? "有序" : "乱序"}</button>
                                    <button onClick={() => setShowStarredOnly(!showStarredOnly)} className={`flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-3 py-2.5 rounded-xl transition font-medium text-sm ${showStarredOnly ? 'bg-amber-500 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300'}`}><IconStar filled={showStarredOnly} /> {showStarredOnly ? "全部" : "生词"}</button>
                                    <button onClick={() => setHideMastered(!hideMastered)} className={`flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-3 py-2.5 rounded-xl transition font-medium text-sm disabled:opacity-50 ${hideMastered ? 'bg-emerald-500 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300'}`} disabled={isQuizMode}><IconLayers /> {hideMastered ? "全部" : "藏已会"}</button>
                                    <button onClick={resetProgress} className="flex-none flex items-center justify-center px-3 py-2.5 bg-red-50 text-red-600 rounded-xl transition hover:bg-red-100"><IconReset /></button>
                                </div>
                            </div>
                        </div>

                        {isQuizMode ? (
                            <div className="bg-white dark:bg-dark-card p-6 md:p-12 rounded-2xl shadow-sm border border-slate-200 dark:border-dark-border flex flex-col items-center justify-center min-h-[400px]">
                                {displayList.length < 4 ? (
                                    <div className="text-slate-500 text-center">单词少于4个，无法生成测验哦！</div>
                                ) : quizCurrent ? (
                                    <div className="w-full max-w-lg flex flex-col items-center">
                                        <div className="flex items-center gap-3 mb-8"><h2 className="text-4xl md:text-5xl font-bold">{quizCurrent.word}</h2><button onClick={() => speakWord(null, quizCurrent.word)} className="p-2 rounded-full text-indigo-400 bg-indigo-50"><IconVolume /></button></div>
                                        <div className="w-full space-y-3">
                                            {quizOptions.map((opt, i) => {
                                                let btnClass = "bg-slate-50 border-slate-200";
                                                if (quizStatus !== "idle") {
                                                    if (opt.originalIndex === quizCurrent.originalIndex) btnClass = "bg-emerald-100 border-emerald-500 text-emerald-800";
                                                    else if (selectedOption?.originalIndex === opt.originalIndex) btnClass = "bg-red-100 border-red-500 text-red-800";
                                                    else btnClass = "bg-slate-50 border-slate-200 opacity-50";
                                                }
                                                return <button key={i} onClick={() => handleQuizAnswer(opt)} className={`w-full text-left p-4 rounded-xl border-2 font-medium ${btnClass}`}>{opt.meaning}</button>;
                                            })}
                                        </div>
                                    </div>
                                ) : <div className="loader"></div>}
                            </div>
                        ) : (
                            <div onTouchStart={handleTouchStart} onTouchEnd={(e) => handleTouchEnd(e, totalPages)} className="w-full">
                                {isListView ? (
                                    <div className="bg-white dark:bg-dark-card p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap gap-2 md:gap-3 min-h-[300px] content-start">
                                        {paginatedWords.map(w => (
                                            <div key={w._id} className="relative select-none" onPointerDown={(e) => handlePressStart(e, w.originalIndex)} onPointerUp={handlePressEnd} onPointerLeave={handlePressEnd} onContextMenu={(e) => e.preventDefault()}>
                                                <span className={`px-4 py-2 text-sm md:text-base font-medium rounded-xl border block transition-colors duration-200 ${mastered.has(w.originalIndex) ? 'bg-slate-100 text-slate-400 border-transparent line-through' : (starred.has(w.originalIndex) ? 'bg-amber-50 text-amber-700 border-amber-200' : 'bg-white text-slate-800 border-slate-200')}`}>{w.word}</span>
                                                {longPressIdx === w.originalIndex && (
                                                    <div className="absolute z-50 bottom-[calc(100%+8px)] left-1/2 -translate-x-1/2 w-48 p-3 bg-slate-800 text-white rounded-xl shadow-xl animate-pop-in pointer-events-none">
                                                        <div className="font-bold text-indigo-300 mb-1">{w.word}</div><div className="text-sm">{w.meaning}</div><div className="absolute -bottom-1.5 left-1/2 -translate-x-1/2 w-3 h-3 bg-slate-800 rotate-45"></div>
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                                        {paginatedWords.map((item) => (
                                            <WordCard key={item._id} item={item} isMastered={mastered.has(item.originalIndex)} isStarred={starred.has(item.originalIndex)} toggleMastered={toggleMastered} toggleStarred={toggleStarred} globalReveal={globalReveal} speakWord={speakWord} />
                                        ))}
                                    </div>
                                )}

                                {totalPages > 1 && (
                                    <div className="mt-8 mb-4 flex flex-wrap items-center justify-center gap-3 md:gap-4 bg-white dark:bg-dark-card py-3 px-4 md:px-6 rounded-2xl shadow-sm border w-max mx-auto">
                                        <button onClick={() => setCurrentPage(p => Math.max(1, p - 1))} disabled={currentPage === 1 || currentPage === ""} className="p-2 rounded-full hover:bg-slate-100 disabled:opacity-30 transition"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
                                        <div className="flex items-center text-slate-600 font-medium gap-2">
                                            <span>第</span><input type="number" min="1" max={totalPages} value={currentPage} onChange={(e) => {const v=e.target.value; if(v==="") setCurrentPage(""); else setCurrentPage(Math.max(1, Math.min(totalPages, parseInt(v,10)||1)));}} className="w-14 text-center bg-slate-50 border rounded-lg py-1 outline-none" /><span>页 / 共 {totalPages} 页</span>
                                        </div>
                                        <button onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))} disabled={currentPage === totalPages || currentPage === ""} className="p-2 rounded-full hover:bg-slate-100 disabled:opacity-30 transition"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js'); });
        }
    </script>
</body>
</html>
